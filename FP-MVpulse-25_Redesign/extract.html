<!doctype html>
<html><head><meta charset="utf-8"><title>extract</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head><body><pre id="log"></pre>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const files={lc:'src/flexpoint-mvpulse-machine-vision-laser-2025.pdf',ds:'src/FP-MVpulse-25_Datasheet.pdf',pc1:'src/FP-MVpulse-25_Pulse-control_1.pdf',pc2:'src/FP-MVpulse-25_Pulse-control_2.pdf'};
const log=s=>document.getElementById('log').textContent+=s+'\n';
async function put(name,body){await fetch('/api/put?name='+encodeURIComponent(name),{method:'POST',body});}
window.run=async function(scale){
  for(const [k,f] of Object.entries(files)){
    const pdf=await pdfjsLib.getDocument(f).promise; let txt='';
    for(let i=1;i<=pdf.numPages;i++){
      const pg=await pdf.getPage(i); const vp=pg.getViewport({scale});
      const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      await put(`extract/${k}-p${i}.png`, c.toDataURL('image/png').split(',')[1]);
      const tc=await pg.getTextContent(); const v1=pg.getViewport({scale:1});
      txt+=`\n===== ${k} page ${i} (${v1.width.toFixed(0)}x${v1.height.toFixed(0)}pt) =====\n`;
      // group into lines by y
      const items=tc.items.filter(t=>t.str.trim()!=='').map(t=>({s:t.str,x:t.transform[4],y:v1.height-t.transform[5],h:t.height}));
      items.sort((a,b)=>a.y-b.y||a.x-b.x); let line=[],ly=null;
      const flush=()=>{ if(line.length){ line.sort((a,b)=>a.x-b.x); txt+=`[y${ly.toFixed(0)}] `+line.map(t=>`(x${t.x.toFixed(0)})${t.s}`).join(' ')+'\n'; } line=[]; };
      for(const t of items){ if(ly===null||Math.abs(t.y-ly)>2){ flush(); ly=t.y; } line.push(t); } flush();
      log(`${k} p${i} done`);
    }
    await put(`extract/${k}.txt`, txt);
  }
  log('ALL DONE'); return 'done';
};
</script></body></html>
